# kind cluster with a control plane and three workers, for the game day scenario that drains a node.
# The ingress controller runs on the control plane (the label and the ports are those of ci/kind-config.yaml); the
# control plane keeps its taint when there are workers, so the application runs on the workers only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
