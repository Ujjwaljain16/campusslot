# kind cluster for the policy drill. The default network plugin of kind (kindnet) does not enforce
# NetworkPolicy, so it is switched off and Calico is installed instead (see .github/workflows/drills.yml).
# The ingress mappings are those of ci/kind-config.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
