# kind cluster used by the GitHub Actions deploy job.
# The node is labelled ingress-ready and ports 80/443 are mapped to the runner, so after the
# ingress controller is installed, "curl http://localhost/" reaches the application through the
# Ingress exactly as a browser would.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
