name: CampusSlot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels the older run. Runs on main are never cancelled,
# so a deployment that has started is always allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/ujjwaljain16/campusslot

jobs:
  # ------------------------------------------------------------------------------------------
  # Decide whether the change needs the whole pipeline. A push or pull request that only touches
  # documentation skips the heavy jobs. A skipped job counts as passed for the required checks of
  # the protected branch, so documentation changes still merge.
  # ------------------------------------------------------------------------------------------
  changes:
    name: Detect changes
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/changes.sh

  # ------------------------------------------------------------------------------------------
  # Quality gate 1: backend lint, security lint and unit tests (fast SQLite database)
  # ------------------------------------------------------------------------------------------
  backend-test:
    name: Backend tests
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Static security analysis (bandit, medium severity and above)
        run: bandit -r app -ll
      - name: Dependency audit (pip-audit, software composition analysis)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Run pytest with a coverage floor
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

  # ------------------------------------------------------------------------------------------
  # Quality gate 2: frontend unit tests, dependency audit and production build
  # ------------------------------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build

  # ------------------------------------------------------------------------------------------
  # Quality gate 3: migrations and the overlap constraint on a real PostgreSQL
  # ------------------------------------------------------------------------------------------
  postgres-integration:
    name: PostgreSQL integration tests
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: campusslot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:ci-only-throwaway@localhost:5432/campusslot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the PostgreSQL integration tests
        run: pytest -v -m postgres

  # ------------------------------------------------------------------------------------------
  # Quality gate 4: secret scanning over the whole git history
  # ------------------------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        run: gitleaks detect --source . --verbose

  # ------------------------------------------------------------------------------------------
  # Quality gate 5: static analysis of the infrastructure code and the Kubernetes manifests.
  # Accepted findings live in terraform/.trivyignore.yaml and helm/.trivyignore.yaml, each with a
  # written reason, so a new finding fails the build and an old one is explained.
  # ------------------------------------------------------------------------------------------
  static-analysis:
    name: Static analysis (Terraform and Helm)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Scan the Terraform (demonstration profile)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_TF_VARS: terraform/terraform.tfvars.example
        with:
          scan-type: config
          scan-ref: terraform
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          trivyignores: terraform/.trivyignore.yaml
          format: table

      # The security controls that the demonstration leaves off for cost must disappear when they are
      # switched on. Only the permanent, explained exceptions may remain in the production profile.
      - name: Scan the Terraform (production profile must clear the cost-driven findings)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_TF_VARS: terraform/terraform.tfvars.prod.example
        with:
          scan-type: config
          scan-ref: terraform
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: prod-terraform.json
      - name: Check the production profile findings
        run: |
          python3 - <<'PY'
          import json, sys
          permanent = {"AWS-0040", "AWS-0041", "AWS-0104", "AWS-0164"}
          found = {m["ID"] for r in json.load(open("prod-terraform.json")).get("Results", [])
                   for m in (r.get("Misconfigurations") or [])}
          print("findings in the production profile:", sorted(found))
          unexpected = found - permanent
          if unexpected:
              print("not allowed in the production profile:", sorted(unexpected))
              sys.exit(1)
          print("only the documented permanent exceptions remain")
          PY

      - name: Scan the Helm chart
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_HELM_VALUES: helm/campusslot/values-ci.yaml
          TRIVY_HELM_SET: backend.image.tag=ci,frontend.image.tag=ci,postgres.password=ci
        with:
          scan-type: config
          scan-ref: helm/campusslot
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          trivyignores: helm/.trivyignore.yaml
          format: table

      # Validation comes last on purpose. "terraform init" downloads the module cache into
      # terraform/.terraform, and a scan after it would also report the example manifests that
      # ship inside those third-party modules.
      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate the rendered manifests against the Kubernetes schema
        run: |
          version=v0.8.0
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${version}/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz$" CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          # The three value sets that are really used: CI, local development, and what Argo CD renders.
          for values in "-f helm/campusslot/values-ci.yaml" \
                        "-f helm/campusslot/values-dev.yaml" \
                        "-f helm/campusslot/values-dev.yaml -f gitops/values.yaml"; do
            echo "== helm template $values"
            helm template campusslot helm/campusslot $values \
              --set backend.image.tag=ci --set frontend.image.tag=ci --set-string postgres.password=ci \
              | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.36.0
          done

  # ------------------------------------------------------------------------------------------
  # Build both images in parallel, scan them with Trivy, and push to GHCR only if both are clean AND
  # every quality gate has succeeded. The build starts at once, while the tests and the static analysis
  # are still running, and the push waits for them. Images are tagged with the commit SHA so every
  # deployment traces back to one commit.
  # ------------------------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan and push images
    # These jobs wait for others, so the limit has to be longer than the longest wait.
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write      # keyless signing with the identity of this workflow run
      attestations: write  # store the provenance and the SBOM attestations
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build both images in parallel
        uses: docker/bake-action@v7
        env:
          SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          load: true
          push: false

      # Security gate: any fixable HIGH or CRITICAL finding fails the job, so nothing below runs.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Everything above needs no other job. Pushing an image does: it must not happen unless the tests,
      # the dependency audits, the secret scan and the static analysis have all succeeded.
      - name: Wait for the other quality gates before pushing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash .github/scripts/wait-for-jobs.sh 1800
          "Backend tests" "Frontend build" "PostgreSQL integration tests"
          "Secret scan (gitleaks)" "Static analysis (Terraform and Helm)"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images tagged with the commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          {
            echo "### Images published"
            echo "- \`${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}\`"
            echo "- \`${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Supply chain: record where each image came from and what is inside it, signed with the identity
      # of this workflow run (no key to store). The deploy job verifies both before it installs anything.
      - name: Resolve the digests of the pushed images
        id: digest
        if: github.event_name != 'pull_request'
        run: |
          for image in backend frontend; do
            digest="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-${image}:${GITHUB_SHA}" --format '{{ .Manifest.Digest }}')"
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${image}: ${digest}"
          done

      - name: Generate the SBOM of the backend image
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}-backend@${{ steps.digest.outputs.backend }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          artifact-name: sbom-backend.spdx.json

      - name: Generate the SBOM of the frontend image
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}-frontend@${{ steps.digest.outputs.frontend }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          artifact-name: sbom-frontend.spdx.json

      - name: Attest the build provenance of the backend image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backend
          subject-digest: ${{ steps.digest.outputs.backend }}
          push-to-registry: true

      - name: Attest the build provenance of the frontend image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-frontend
          subject-digest: ${{ steps.digest.outputs.frontend }}
          push-to-registry: true

      - name: Attest the SBOM of the backend image
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backend
          subject-digest: ${{ steps.digest.outputs.backend }}
          sbom-path: sbom-backend.spdx.json
          push-to-registry: true

      - name: Attest the SBOM of the frontend image
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-frontend
          subject-digest: ${{ steps.digest.outputs.frontend }}
          sbom-path: sbom-frontend.spdx.json
          push-to-registry: true

  # ------------------------------------------------------------------------------------------
  # Deploy: install the Helm chart, with the SHA-tagged images just pushed, onto a throw-away
  # kind cluster and prove it works end to end through the Ingress. A laptop cluster cannot be
  # reached from a GitHub runner, so the persistent demo cluster is updated with
  # "make deploy-local SHA=<sha>" using exactly the same chart and the same images.
  # ------------------------------------------------------------------------------------------
  deploy:
    name: Deploy with Helm (kind)
    # These jobs wait for others, so the limit has to be longer than the longest wait.
    timeout-minutes: 60
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
      attestations: read
    env:
      NAMESPACE: campusslot
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: campusslot-ci
          config: ci/kind-config.yaml

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          # A Ready controller pod is not enough: the admission webhook that validates Ingress
          # objects is reached through its own Service, which can lag a moment behind the pod.
          # Installing the chart in that gap fails with "failed calling webhook".
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"
          echo "admission webhook endpoint ready: $ready"

      - name: Create the namespace and the registry pull secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Lint the chart
        run: |
          helm lint helm/campusslot -f helm/campusslot/values-ci.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set-string postgres.password=lint-only

      # The cluster, the ingress controller and the namespace did not need the images, so they were
      # prepared while the images were still being built. From here on the images are needed.
      - name: Wait for the images that the build job publishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-jobs.sh 2400 "Build, scan and push images"

      # Only images that this workflow built, with signed provenance, may be installed.
      - name: Verify the signed provenance and the SBOM of both images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in backend frontend; do
            ref="oci://${IMAGE_PREFIX}-${image}:${{ github.sha }}"
            echo "== ${image}: build provenance"
            gh attestation verify "$ref" --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/ci-cd.yml"
            echo "== ${image}: SBOM"
            gh attestation verify "$ref" --repo "${{ github.repository }}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: helm upgrade --install with the commit SHA tags
        run: |
          # The ingress admission webhook can still refuse connections for a few seconds after
          # its endpoint is ready, while kube-proxy programs the Service address. --atomic removes
          # a failed install completely, so a bounded retry is safe and the chart is never half installed.
          password="$(openssl rand -hex 16)"
          for attempt in 1 2 3; do
            if helm upgrade --install campusslot helm/campusslot \
              --namespace "$NAMESPACE" \
              -f helm/campusslot/values-ci.yaml \
              --set backend.image.tag=${{ github.sha }} \
              --set frontend.image.tag=${{ github.sha }} \
              --set-string postgres.password="$password" \
              --atomic --timeout 6m; then
              exit 0
            fi
            echo "helm attempt $attempt of 3 failed"
            sleep 10
          done
          exit 1

      - name: Show what was deployed
        run: |
          helm list --namespace "$NAMESPACE"
          kubectl get pods,svc,ingress --namespace "$NAMESPACE"

      - name: Smoke test through the Ingress
        run: |
          set -euo pipefail
          # Helm waits for the pods to be Ready, but the ingress controller learns about new backends a
          # few seconds later and answers 503 until then. Every call therefore waits for its own success.
          fetch() {
            for _ in $(seq 1 40); do
              if resp=$(curl -fsS "$1"); then
                echo "$resp"
                return 0
              fi
              sleep 2
            done
            echo "no successful response from $1" >&2
            return 1
          }

          fetch http://localhost/healthz > /dev/null
          echo "frontend health check: ok"

          fetch http://localhost/api/rooms > /tmp/rooms.json
          rooms=$(python3 -c "import json; print(len(json.load(open('/tmp/rooms.json'))))")
          echo "rooms returned by the API: $rooms"
          test "$rooms" -ge 6

          fetch http://localhost/api/info > /tmp/info.json
          deployed=$(python3 -c "import json; print(json.load(open('/tmp/info.json'))['git_sha'])")
          echo "deployed commit: $deployed"
          test "$deployed" = "${{ github.sha }}"

          body='{"room_id":1,"purpose":"CI smoke test","booked_by":"github-actions","start_time":"2030-01-01T10:00:00Z","end_time":"2030-01-01T11:00:00Z"}'
          first=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$body" http://localhost/api/bookings)
          second=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$body" http://localhost/api/bookings)
          echo "first booking: HTTP $first, same slot again: HTTP $second"
          test "$first" = "201"
          test "$second" = "409"

          {
            echo "### Deployed to kind with Helm"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- rooms: $rooms, booking created (201) and the overlapping request rejected (409)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,ingress,events --namespace "$NAMESPACE" || true
          kubectl logs --namespace "$NAMESPACE" --selector app.kubernetes.io/component=backend --tail=80 || true
          kubectl logs --namespace "$NAMESPACE" --selector app.kubernetes.io/component=migration --tail=80 || true
