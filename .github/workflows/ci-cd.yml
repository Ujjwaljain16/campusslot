name: CampusSlot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels the older run. Runs on main are never cancelled,
# so a deployment that has started is always allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/ujjwaljain16/campusslot

jobs:
  # ------------------------------------------------------------------------------------------
  # Quality gate 1: backend lint, security lint and unit tests (fast SQLite database)
  # ------------------------------------------------------------------------------------------
  backend-test:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Static security analysis (bandit, medium severity and above)
        run: bandit -r app -ll
      - name: Run pytest with a coverage floor
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

  # ------------------------------------------------------------------------------------------
  # Quality gate 2: frontend unit tests, dependency audit and production build
  # ------------------------------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build

  # ------------------------------------------------------------------------------------------
  # Quality gate 3: migrations and the overlap constraint on a real PostgreSQL
  # ------------------------------------------------------------------------------------------
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: campusslot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:ci-only-throwaway@localhost:5432/campusslot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the PostgreSQL integration tests
        run: pytest -v -m postgres

  # ------------------------------------------------------------------------------------------
  # Quality gate 4: secret scanning over the whole git history
  # ------------------------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        run: gitleaks detect --source . --verbose

  # ------------------------------------------------------------------------------------------
  # Build both images, scan them with Trivy, and push to GHCR only if both are clean.
  # Images are tagged with the commit SHA so every deployment traces back to one commit.
  # ------------------------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan and push images
    needs: [backend-test, frontend-build, postgres-integration, secret-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Security gate: any fixable HIGH or CRITICAL finding fails the job, so nothing below runs.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images tagged with the commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          {
            echo "### Images published"
            echo "- \`${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}\`"
            echo "- \`${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------------
  # Deploy: install the Helm chart, with the SHA-tagged images just pushed, onto a throw-away
  # kind cluster and prove it works end to end through the Ingress. A laptop cluster cannot be
  # reached from a GitHub runner, so the persistent demo cluster is updated with
  # "make deploy-local SHA=<sha>" using exactly the same chart and the same images.
  # ------------------------------------------------------------------------------------------
  deploy:
    name: Deploy with Helm (kind)
    if: github.event_name != 'pull_request'
    needs: build-scan-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      NAMESPACE: campusslot
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: campusslot-ci
          config: ci/kind-config.yaml

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          # A Ready controller pod is not enough: the admission webhook that validates Ingress
          # objects is reached through its own Service, which can lag a moment behind the pod.
          # Installing the chart in that gap fails with "failed calling webhook".
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"
          echo "admission webhook endpoint ready: $ready"

      - name: Create the namespace and the registry pull secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Lint the chart
        run: |
          helm lint helm/campusslot -f helm/campusslot/values-ci.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set-string postgres.password=lint-only

      - name: helm upgrade --install with the commit SHA tags
        run: |
          helm upgrade --install campusslot helm/campusslot \
            --namespace "$NAMESPACE" \
            -f helm/campusslot/values-ci.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set-string postgres.password="$(openssl rand -hex 16)" \
            --atomic --timeout 6m

      - name: Show what was deployed
        run: |
          helm list --namespace "$NAMESPACE"
          kubectl get pods,svc,ingress --namespace "$NAMESPACE"

      - name: Smoke test through the Ingress
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            curl -fsS http://localhost/healthz > /dev/null && break || sleep 2
          done
          echo "frontend: $(curl -fsS http://localhost/healthz)"

          rooms=$(curl -fsS http://localhost/api/rooms | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "rooms returned by the API: $rooms"
          test "$rooms" -ge 6

          deployed=$(curl -fsS http://localhost/api/info | python3 -c "import sys, json; print(json.load(sys.stdin)['git_sha'])")
          echo "deployed commit: $deployed"
          test "$deployed" = "${{ github.sha }}"

          body='{"room_id":1,"purpose":"CI smoke test","booked_by":"github-actions","start_time":"2030-01-01T10:00:00Z","end_time":"2030-01-01T11:00:00Z"}'
          first=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$body" http://localhost/api/bookings)
          second=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$body" http://localhost/api/bookings)
          echo "first booking: HTTP $first, same slot again: HTTP $second"
          test "$first" = "201"
          test "$second" = "409"

          {
            echo "### Deployed to kind with Helm"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- rooms: $rooms, booking created (201) and the overlapping request rejected (409)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,ingress,events --namespace "$NAMESPACE" || true
          kubectl logs --namespace "$NAMESPACE" --selector app.kubernetes.io/component=backend --tail=80 || true
          kubectl logs --namespace "$NAMESPACE" --selector app.kubernetes.io/component=migration --tail=80 || true
