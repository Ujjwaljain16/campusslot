name: Drills (v2)

# The drills of v2 on throw-away kind clusters of GitHub-hosted runners, so that no laptop is needed.
# A drill runs when a branch named drill/<phase> is pushed, and only that phase runs:
#
#   git push origin v2:refs/heads/drill/phase1
#
# The workflow file is read from the pushed branch, so main (the submitted version) is never touched.
# Every job saves its transcripts and the state of the cluster as an artifact. Numbers measured here come
# from a shared runner (4 vCPU, 16 GB, one kind node): the documents say so next to every result.
#
# The images are the ones that the CI pipeline built for IMAGE_SHA. Change IMAGE_SHA when the code of the
# backend or the frontend changes; the chart and the scripts always come from the pushed branch.
on:
  push:
    branches: ['drill/**']

concurrency:
  group: drills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_SHA: 2ca20e497c58cd409a9b1c2b7d36413a6370d4b2
  NAMESPACE: campusslot
  PYTHON: python3

defaults:
  run:
    shell: bash   # bash -eo pipefail, so a failure before a pipe to tee is not hidden

jobs:
  phase1:
    name: Phase 1, canary (${{ matrix.mode }})
    if: startsWith(github.ref_name, 'drill/phase1')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [control, canary]
    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p evidence

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: drill
          config: ci/kind-config.yaml

      - name: Record the environment of the measurements
        run: |
          {
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/ {print $2}') MB memory, $(uname -r)"
            echo "kubernetes: $(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
            echo "image: ghcr.io/ujjwaljain16/campusslot-backend:$IMAGE_SHA"
            echo "mode: ${{ matrix.mode }}"
          } | tee evidence/environment.txt

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"

      - name: Install Prometheus without Grafana, because the drill reads Prometheus directly
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace --version 91.9.0 \
            -f monitoring/kube-prometheus-stack-values.yaml --set grafana.enabled=false \
            --wait --timeout 10m

      - name: Install the Argo Rollouts controller
        if: matrix.mode == 'canary'
        run: scripts/install-rollouts.sh

      - name: Deploy the application
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          extra=()
          if [ "${{ matrix.mode }}" = "canary" ]; then extra+=(--set rollout.enabled=true); fi
          password="$(openssl rand -hex 16)"
          for attempt in 1 2 3; do
            if helm upgrade --install campusslot helm/campusslot --namespace "$NAMESPACE" \
              -f helm/campusslot/values-ci.yaml \
              --set serviceMonitor.enabled=true --set serviceMonitor.interval=15s --set prometheusRule.enabled=true \
              "${extra[@]}" \
              --set backend.image.tag="$IMAGE_SHA" --set frontend.image.tag="$IMAGE_SHA" \
              --set-string postgres.password="$password" --atomic --timeout 6m; then
              break
            fi
            echo "helm attempt $attempt of 3 failed"; sleep 10
            [ "$attempt" = 3 ] && exit 1
          done
          if [ "${{ matrix.mode }}" = "canary" ]; then
            # helm does not wait for a Rollout; the first revision goes straight to Healthy.
            kubectl wait --namespace "$NAMESPACE" --for=jsonpath='{.status.phase}'=Healthy rollout/campusslot-backend --timeout=300s
          else
            kubectl rollout status deployment/campusslot-backend --namespace "$NAMESPACE" --timeout=300s
          fi
          kubectl get pods,svc,ingress --namespace "$NAMESPACE"

      - name: Warm up, and wait until Prometheus has numbers for the application
        run: |
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 >/dev/null 2>&1 &
          sleep 5
          python3 scripts/probe.py http://localhost/api/rooms --seconds 45 --interval 0.1 --label warm-up | tail -5
          for _ in $(seq 1 30); do
            n=$(curl -s --get http://localhost:9090/api/v1/query --data-urlencode "query=count(http_requests_total{namespace=\"$NAMESPACE\"})" | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)')
            echo "series of http_requests_total in Prometheus: $n"
            [ "$n" != "0" ] && break
            sleep 5
          done
          test "$n" != "0"

      - name: The drill
        env:
          URL: http://localhost/api/rooms
          PROM: http://localhost:9090
        run: |
          # Two recorders next to the drill: the Ingress objects (does the canary Ingress keep the frontend rule?)
          # and the status of the frontend page (does the page stay up while the traffic is split?).
          ( while true; do
              echo "--- $(date +%T)"
              kubectl get ingress -n "$NAMESPACE" -o custom-columns='NAME:.metadata.name,PATHS:.spec.rules[*].http.paths[*].path,CANARY:.metadata.annotations.nginx\.ingress\.kubernetes\.io/canary,WEIGHT:.metadata.annotations.nginx\.ingress\.kubernetes\.io/canary-weight' --no-headers
              sleep 5
            done ) > evidence/ingress-timeline.txt 2>&1 &
          ( while true; do
              echo "$(date +%T) $(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost/)"
              sleep 1
            done ) > evidence/frontend-timeline.txt 2>&1 &

          if [ "${{ matrix.mode }}" = "control" ]; then
            SECONDS_TOTAL=180 scripts/canary-drill.sh control 2>&1 | tee evidence/control.txt
          else
            SECONDS_TOTAL=240 scripts/canary-drill.sh good 2>&1 | tee evidence/good.txt
            kubectl wait --namespace "$NAMESPACE" --for=jsonpath='{.status.phase}'=Healthy rollout/campusslot-backend --timeout=120s
            sleep 30
            SECONDS_TOTAL=180 scripts/canary-drill.sh bad 2>&1 | tee evidence/bad.txt
          fi

      - name: The state of the cluster afterwards
        if: always()
        run: |
          kubectl get rollout,analysisrun,replicaset,pods,ingress,events -n "$NAMESPACE" -o wide > evidence/cluster-state.txt 2>&1 || true
          kubectl get analysisrun -n "$NAMESPACE" -o yaml > evidence/analysisruns.yaml 2>&1 || true
          kubectl get rollout -n "$NAMESPACE" -o yaml > evidence/rollout.yaml 2>&1 || true
          kubectl logs -n argo-rollouts deploy/argo-rollouts --tail=200 > evidence/rollouts-controller.log 2>&1 || true
          sort evidence/frontend-timeline.txt 2>/dev/null | awk '{print $2}' | sort | uniq -c > evidence/frontend-status-counts.txt || true
          { echo "### Phase 1, ${{ matrix.mode }}"; echo; echo '```'; cat evidence/environment.txt; echo '```';
            echo "Frontend page status counts while the drill ran:"; echo '```'; cat evidence/frontend-status-counts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-${{ matrix.mode }}
          path: evidence/

  phase2:
    name: Phase 2, policies (Calico)
    if: startsWith(github.ref_name, 'drill/phase2')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p evidence
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create the kind cluster without a network plugin
        uses: helm/kind-action@v1
        with:
          cluster_name: drill
          config: ci/kind-calico.yaml

      - name: Install Calico, which enforces NetworkPolicy
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml
          kubectl -n kube-system set env daemonset/calico-node FELIX_IGNORELOOSERPF=true
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl -n kube-system rollout status deployment/coredns --timeout=300s

      - name: Record the environment of the measurements
        run: |
          {
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/ {print $2}') MB memory, $(uname -r)"
            echo "kubernetes: $(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
            echo "network plugin: Calico v3.30.3"
            echo "image: ghcr.io/ujjwaljain16/campusslot-backend:$IMAGE_SHA"
          } | tee evidence/environment.txt

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"

      - name: Install Prometheus, to see whether the backend stays scraped
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace --version 91.9.0 \
            -f monitoring/kube-prometheus-stack-values.yaml --set grafana.enabled=false \
            --wait --timeout 10m

      - name: Deploy the application, with the network policies still off
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          password="$(openssl rand -hex 16)"
          for attempt in 1 2 3; do
            if helm upgrade --install campusslot helm/campusslot --namespace "$NAMESPACE" \
              -f helm/campusslot/values-ci.yaml \
              --set serviceMonitor.enabled=true --set serviceMonitor.interval=15s \
              --set backend.image.tag="$IMAGE_SHA" --set frontend.image.tag="$IMAGE_SHA" \
              --set-string postgres.password="$password" --atomic --timeout 6m; then
              break
            fi
            echo "helm attempt $attempt of 3 failed"; sleep 10
            [ "$attempt" = 3 ] && exit 1
          done
          kubectl get pods,svc,ingress --namespace "$NAMESPACE"

      - name: The control, network checks with no policy (the blocked ones must fail here)
        run: |
          scripts/policy-drill.sh network 2>&1 | tee evidence/network-before.txt || true

      - name: Enable the network policies, and check that the application still works
        run: |
          helm upgrade campusslot helm/campusslot -n "$NAMESPACE" --reuse-values --set networkPolicy.enabled=true
          kubectl get networkpolicy -n "$NAMESPACE" | tee evidence/networkpolicies.txt
          sleep 15
          scripts/policy-drill.sh network 2>&1 | tee evidence/network-after.txt || true
          bash scripts/ci-app-checks.sh 2>&1 | tee evidence/application-with-policies.txt

      - name: Admission policy of Kubernetes (CEL)
        run: |
          kubectl apply -f policies/admission/restrict-images.yaml
          sleep 10
          kubectl get validatingadmissionpolicy campusslot-restrict-images -o jsonpath='{.status}' > evidence/vap-status.json 2>&1 || true
          scripts/policy-drill.sh admission 2>&1 | tee evidence/admission.txt || true

      - name: Kyverno, the build attestation of the images
        run: |
          scripts/install-kyverno.sh
          kubectl apply -f policies/kyverno/verify-image-attestations.yaml
          kubectl wait --for=condition=Ready clusterpolicy/campusslot-verify-image-attestations --timeout=120s || true
          kubectl get clusterpolicy campusslot-verify-image-attestations -o yaml > evidence/kyverno-policy-status.yaml 2>&1 || true
          sleep 10
          # 6f22604 is the last commit of main before the attestations existed: its image was never attested.
          BAD_ATTEST=ghcr.io/ujjwaljain16/campusslot-backend:6f22604ad87c09e44d6ca39fdcc51ae56dd54ac9 \
            scripts/policy-drill.sh admission 2>&1 | tee evidence/admission-with-kyverno.txt || true

      - name: Diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide > evidence/pods.txt 2>&1 || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=150 > evidence/kyverno-admission.log 2>&1 || true
          kubectl get validatingadmissionpolicy,validatingadmissionpolicybinding,clusterpolicy -o yaml > evidence/policies.yaml 2>&1 || true
          for f in network-before network-after admission admission-with-kyverno; do
            echo "**$f**" >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; grep -E '^(PASS|FAIL|passed|skip)' "evidence/$f.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2
          path: evidence/

  phase3:
    name: Phase 3, database (CloudNativePG)
    if: startsWith(github.ref_name, 'drill/phase3')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE: http://localhost
      OBJECTSTORE_IMAGE: rustfs/rustfs:1.0.3
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p evidence
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: drill
          config: ci/kind-config.yaml

      - name: Record the environment of the measurements
        run: |
          {
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/ {print $2}') MB memory, $(uname -r)"
            echo "kubernetes: $(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
            echo "storage class: $(kubectl get storageclass -o jsonpath='{.items[0].metadata.name}') (local disk of the runner, one node)"
            echo "image: ghcr.io/ujjwaljain16/campusslot-backend:$IMAGE_SHA"
            echo "object store image: $OBJECTSTORE_IMAGE"
          } | tee evidence/environment.txt

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"

      - name: Install the operator, cert-manager, the backup plugin and the object store
        run: |
          WITH_BACKUP=1 scripts/install-cnpg.sh 2>&1 | tee evidence/install-cnpg.txt
          scripts/install-objectstore.sh 2>&1 | tee evidence/install-objectstore.txt

      - name: Deploy the application on a database cluster with backups
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          password="$(openssl rand -hex 16)"
          for attempt in 1 2 3; do
            if helm upgrade --install campusslot helm/campusslot --namespace "$NAMESPACE" \
              -f helm/campusslot/values-ci.yaml \
              --set postgres.operator.enabled=true --set postgres.operator.backup.enabled=true \
              --set backend.image.tag="$IMAGE_SHA" --set frontend.image.tag="$IMAGE_SHA" \
              --set-string postgres.password="$password" --atomic --timeout 10m; then
              break
            fi
            echo "helm attempt $attempt of 3 failed"; sleep 10
            [ "$attempt" = 3 ] && exit 1
          done
          kubectl wait --for=condition=Ready cluster/campusslot-pg -n "$NAMESPACE" --timeout=600s
          kubectl get cluster,pods,objectstore -n "$NAMESPACE" -o wide | tee evidence/cluster-before.txt
          for _ in $(seq 1 30); do curl -fsS "$BASE/api/rooms" >/dev/null && break; sleep 2; done

      - name: Failover with asynchronous replication
        run: |
          PYTHON=python3 FIRST_SLOT=0 scripts/db-drill.sh failover 2>&1 | tee evidence/failover-async.txt || true

      - name: Failover with synchronous replication
        run: |
          helm upgrade campusslot helm/campusslot -n "$NAMESPACE" --reuse-values --set postgres.operator.synchronous=true
          sleep 20
          python3 scripts/cnpg_watch.py --namespace "$NAMESPACE" --cluster campusslot-pg --seconds 300 --until-healthy | tail -n 2 || true
          PYTHON=python3 FIRST_SLOT=1000 scripts/db-drill.sh failover 2>&1 | tee evidence/failover-sync.txt || true

      - name: Point in time recovery
        run: |
          # The recovery is of the cluster as it is; the synchronous setting does not matter for it.
          python3 scripts/cnpg_watch.py --namespace "$NAMESPACE" --cluster campusslot-pg --seconds 300 --until-healthy | tail -n 2
          PYTHON=python3 scripts/db-drill.sh pitr 2>&1 | tee evidence/pitr.txt || true

      - name: Diagnostics
        if: always()
        run: |
          kubectl get cluster,backup,scheduledbackup,objectstore,pods -n "$NAMESPACE" -o wide > evidence/cluster-after.txt 2>&1 || true
          kubectl get cluster -n "$NAMESPACE" -o yaml > evidence/cluster.yaml 2>&1 || true
          kubectl get backup -n "$NAMESPACE" -o yaml > evidence/backups.yaml 2>&1 || true
          kubectl logs -n cnpg-system deploy/cnpg-cloudnative-pg --tail=300 > evidence/operator.log 2>&1 || true
          kubectl logs -n cnpg-system deploy/barman-cloud --tail=200 > evidence/barman-plugin.log 2>&1 || true
          kubectl logs -n object-store deploy/rustfs --tail=100 > evidence/objectstore.log 2>&1 || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          for f in failover-async failover-sync pitr; do
            echo "**$f**" >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; tail -n 25 "evidence/$f.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3
          path: evidence/

  phase4:
    name: Phase 4, linked signals (metric, trace, log)
    if: startsWith(github.ref_name, 'drill/phase4')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE: http://localhost
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p evidence
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: drill
          config: ci/kind-config.yaml

      - name: Record the environment of the measurements
        run: |
          {
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/ {print $2}') MB memory, $(uname -r)"
            echo "kubernetes: $(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
            echo "image: ghcr.io/ujjwaljain16/campusslot-backend:$IMAGE_SHA"
          } | tee evidence/environment.txt

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"

      - name: Install Prometheus, Grafana, Loki and Alloy
        run: scripts/install-monitoring.sh 2>&1 | tee evidence/install-monitoring.txt

      - name: Install Tempo and link the data sources
        run: scripts/install-tracing.sh 2>&1 | tee evidence/install-tracing.txt

      - name: Deploy the application as a plain Deployment
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          password="$(openssl rand -hex 16)"
          for attempt in 1 2 3; do
            if helm upgrade --install campusslot helm/campusslot --namespace "$NAMESPACE" \
              -f helm/campusslot/values-ci.yaml \
              --set serviceMonitor.enabled=true --set serviceMonitor.interval=15s --set prometheusRule.enabled=true \
              --set backend.image.tag="$IMAGE_SHA" --set frontend.image.tag="$IMAGE_SHA" \
              --set-string postgres.password="$password" --atomic --timeout 6m; then
              break
            fi
            echo "helm attempt $attempt of 3 failed"; sleep 10
            [ "$attempt" = 3 ] && exit 1
          done
          kubectl get pods -n "$NAMESPACE"

      - name: Port forwards, and the state of the data sources in Grafana
        run: |
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 >/dev/null 2>&1 &
          kubectl port-forward -n monitoring svc/tempo 3200:3200 >/dev/null 2>&1 &
          kubectl port-forward -n monitoring svc/loki 3100:3100 >/dev/null 2>&1 &
          kubectl port-forward -n monitoring svc/monitoring-grafana 3000:80 >/dev/null 2>&1 &
          sleep 8
          for url in http://localhost:9090/-/ready http://localhost:3200/ready http://localhost:3100/ready; do
            for _ in $(seq 1 40); do curl -sf -o /dev/null "$url" && break; sleep 3; done
            echo "$url -> $(curl -s -o /dev/null -w '%{http_code}' "$url")"
          done
          pw="$(kubectl get secret monitoring-grafana -n monitoring -o jsonpath='{.data.admin-password}' | base64 -d)"
          {
            echo "== Grafana data sources (health, and the links between them)"
            for uid in loki tempo; do
              echo "-- $uid health: $(curl -s -u "admin:$pw" "http://localhost:3000/api/datasources/uid/$uid/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status"), d.get("message"))')"
            done
            curl -s -u "admin:$pw" http://localhost:3000/api/datasources/uid/loki | python3 -c 'import json,sys; d=json.load(sys.stdin); print("-- Loki derived fields:", json.dumps(d["jsonData"].get("derivedFields")))'
            curl -s -u "admin:$pw" http://localhost:3000/api/datasources/uid/tempo | python3 -c 'import json,sys; d=json.load(sys.stdin); print("-- Tempo traces to logs:", json.dumps(d["jsonData"].get("tracesToLogsV2")))'
            echo "-- dashboards in Grafana:"
            curl -s -u "admin:$pw" "http://localhost:3000/api/search?type=dash-db" | python3 -c 'import json,sys; [print("  ", x["title"], x["uid"]) for x in json.load(sys.stdin)]'
          } 2>&1 | tee evidence/grafana.txt

      - name: Warm up, so that the metric has a baseline
        run: |
          for _ in $(seq 1 30); do curl -fsS "$BASE/api/rooms" >/dev/null && break; sleep 2; done
          python3 scripts/probe.py "$BASE/api/rooms" --seconds 20 --interval 0.2 --label warm-up | tail -3
          sleep 60   # the recording rule needs an evaluation or two

      - name: The drill, from the metric to the trace to the log line
        run: |
          PYTHON=python3 scripts/trace-drill.sh 2>&1 | tee evidence/trace-drill.txt

      - name: Diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide > evidence/pods.txt 2>&1 || true
          kubectl logs -n monitoring statefulset/tempo --tail=200 > evidence/tempo.log 2>&1 || true
          kubectl logs -n monitoring daemonset/alloy --tail=100 > evidence/alloy.log 2>&1 || true
          kubectl logs -n campusslot -l app.kubernetes.io/component=backend --tail=40 > evidence/backend.log 2>&1 || true
          { echo '```'; tail -n 25 evidence/trace-drill.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4
          path: evidence/

  phase5:
    name: Phase 5, environments and promotion (Argo CD)
    if: startsWith(github.ref_name, 'drill/phase5')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The drill pushes one branch of its own (promotion-drill), because Argo CD follows what is on GitHub.
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the promotion rules check that a build is a commit of this repository
      - run: mkdir -p evidence
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: drill
          config: ci/kind-config.yaml

      - name: Record the environment of the measurements
        run: |
          {
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/ {print $2}') MB memory, $(uname -r)"
            echo "kubernetes: $(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
            echo "argo cd chart: 10.9.6, polling Git every 30 s"
            echo "old build: c0d5a17a0c00, new build: d79ce938f742"
          } | tee evidence/environment.txt

      - name: Install the ingress controller, because Argo CD calls an Ingress without an address Progressing
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=180s

      - name: Setup, Argo CD with the ApplicationSet, dev and staging at the old build
        env:
          PYTHON: python3
          REDIS_REPOSITORY: mirror.gcr.io/library/redis   # ecr-public.aws.com answered 429 to the runner
        run: scripts/gitops-drill.sh setup 2>&1 | tee evidence/setup.txt

      - name: Promote, a build goes to dev, a wrong promotion is refused, staging takes what dev runs
        env:
          PYTHON: python3
        run: scripts/gitops-drill.sh promote 2>&1 | tee evidence/promote.txt || true

      - name: Drift, change the cluster by hand and measure how long Argo CD takes to undo it
        run: scripts/gitops-drill.sh drift 2>&1 | tee evidence/drift.txt || true

      - name: Diagnostics
        if: always()
        run: |
          kubectl get applications,applicationsets -n argocd -o yaml > evidence/applications.yaml 2>&1 || true
          kubectl get pods -A -o wide > evidence/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          kubectl describe pods -n argocd > evidence/argocd-pods-described.txt 2>&1 || true
          kubectl logs -n argocd deploy/argocd-applicationset-controller --tail=100 > evidence/applicationset-controller.log 2>&1 || true
          kubectl logs -n argocd statefulset/argocd-application-controller --tail=150 > evidence/application-controller.log 2>&1 || true
          git -C ../campusslot-promotion-drill log --oneline -8 > evidence/drill-branch-log.txt 2>&1 || true
          for f in setup promote drift; do
            echo "**$f**" >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; tail -n 25 "evidence/$f.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Cleanup, remove the drill branch from GitHub
        if: always()
        env:
          PYTHON: python3
        run: scripts/gitops-drill.sh cleanup 2>&1 | tee evidence/cleanup.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5
          path: evidence/

  phase6:
    name: Phase 6, game day (session ${{ matrix.session }})
    if: startsWith(github.ref_name, 'drill/phase6')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - session: A
            what: lean, plain Deployment and one database pod
            kind_config: ci/kind-config.yaml
          - session: B
            what: canary, Prometheus and the Rollouts controller
            kind_config: ci/kind-config.yaml
          - session: C
            what: database, the operator
            kind_config: ci/kind-config.yaml
          - session: D
            what: node drain, a control plane and three workers
            kind_config: ci/kind-multinode.yaml
          - session: E
            what: tracing overhead, the full monitoring stack and Tempo
            kind_config: ci/kind-config.yaml
    env:
      SESSION: ${{ matrix.session }}
      PYTHON: python3
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p evidence
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: drill
          config: ${{ matrix.kind_config }}

      - name: Record the environment of the measurements
        run: |
          {
            echo "session ${{ matrix.session }}: ${{ matrix.what }}"
            echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/ {print $2}') MB memory, $(uname -r)"
            echo "kubernetes: $(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
            echo "nodes: $(kubectl get nodes --no-headers | wc -l)"
            echo "image: ghcr.io/ujjwaljain16/campusslot-backend:$IMAGE_SHA"
          } | tee evidence/environment.txt

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          for _ in $(seq 1 60); do
            ready=$(kubectl get endpointslices --namespace ingress-nginx \
              -l kubernetes.io/service-name=ingress-nginx-controller-admission \
              -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}')
            [ -n "$ready" ] && break
            sleep 2
          done
          test -n "$ready"

      - name: Install what this session needs
        run: |
          case "$SESSION" in
            B)
              helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
              helm repo update prometheus-community
              helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
                --namespace monitoring --create-namespace --version 91.9.0 \
                -f monitoring/kube-prometheus-stack-values.yaml --set grafana.enabled=false --wait --timeout 10m
              scripts/install-rollouts.sh
              ;;
            C)
              scripts/install-cnpg.sh
              ;;
            E)
              scripts/install-monitoring.sh
              scripts/install-tracing.sh
              ;;
          esac

      - name: Deploy the application
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr --namespace "$NAMESPACE" \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          extra=()
          case "$SESSION" in
            B) extra+=(--set rollout.enabled=true --set serviceMonitor.enabled=true --set serviceMonitor.interval=15s --set prometheusRule.enabled=true) ;;
            C) extra+=(--set postgres.operator.enabled=true) ;;
            D) extra+=(--set backend.replicaCount=3) ;;
            E) extra+=(--set serviceMonitor.enabled=true --set serviceMonitor.interval=15s --set prometheusRule.enabled=true) ;;
          esac
          password="$(openssl rand -hex 16)"
          for attempt in 1 2 3; do
            if helm upgrade --install campusslot helm/campusslot --namespace "$NAMESPACE" \
              -f helm/campusslot/values-ci.yaml "${extra[@]}" \
              --set backend.image.tag="$IMAGE_SHA" --set frontend.image.tag="$IMAGE_SHA" \
              --set-string postgres.password="$password" --atomic --timeout 10m; then
              break
            fi
            echo "helm attempt $attempt of 3 failed"; sleep 10
            [ "$attempt" = 3 ] && exit 1
          done
          case "$SESSION" in
            B) kubectl wait --namespace "$NAMESPACE" --for=jsonpath='{.status.phase}'=Healthy rollout/campusslot-backend --timeout=300s ;;
            C) kubectl wait --for=condition=Ready cluster/campusslot-pg -n "$NAMESPACE" --timeout=600s ;;
            *) kubectl rollout status deployment/campusslot-backend --namespace "$NAMESPACE" --timeout=300s ;;
          esac
          for _ in $(seq 1 30); do curl -fsS http://localhost/api/rooms >/dev/null && break; sleep 2; done
          kubectl get pods -n "$NAMESPACE" -o wide | tee evidence/pods-before.txt

      - name: Prometheus port forward, for the alert watcher
        if: matrix.session == 'B' || matrix.session == 'E'
        run: |
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 >/dev/null 2>&1 &
          sleep 8
          curl -s -o /dev/null -w "prometheus: %{http_code}\n" http://localhost:9090/-/ready

      - name: The game day
        run: |
          # The drills are measurements: the verdict is in the report, so a FAIL does not stop the job.
          case "$SESSION" in
            A) python3 scripts/gameday.py run --base http://localhost --scenarios backend-pod-kill,database-pod-restart --out evidence/gameday.md 2>&1 | tee evidence/gameday.txt || true ;;
            B) python3 scripts/gameday.py run --base http://localhost --scenarios bad-release,slow-release --out evidence/gameday.md 2>&1 | tee evidence/gameday.txt || true ;;
            C)
              python3 scripts/gameday.py run --base http://localhost --scenarios database-primary-failover --out evidence/gameday-async.md 2>&1 | tee evidence/gameday-async.txt || true
              helm upgrade campusslot helm/campusslot -n "$NAMESPACE" --reuse-values --set postgres.operator.synchronous=true
              sleep 20
              python3 scripts/cnpg_watch.py --namespace "$NAMESPACE" --cluster campusslot-pg --seconds 300 --until-healthy | tail -n 2 || true
              python3 scripts/gameday.py run --base http://localhost --first-slot 40000 --scenarios database-primary-failover --out evidence/gameday-sync.md 2>&1 | tee evidence/gameday-sync.txt || true
              ;;
            D) python3 scripts/gameday.py run --base http://localhost --scenarios node-drain --out evidence/gameday.md 2>&1 | tee evidence/gameday.txt || true ;;
            E) python3 scripts/gameday.py overhead --base http://localhost --rounds 3 --seconds 45 2>&1 | tee evidence/overhead.txt || true ;;
          esac

      - name: Diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide > evidence/pods-after.txt 2>&1 || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          kubectl get rollout,analysisrun -n "$NAMESPACE" -o yaml > evidence/rollout.yaml 2>&1 || true
          kubectl get cluster -n "$NAMESPACE" -o yaml > evidence/cluster.yaml 2>&1 || true
          for f in evidence/gameday.md evidence/gameday-async.md evidence/gameday-sync.md; do
            [ -f "$f" ] && { echo "**$f**" >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
          done
          [ -f evidence/overhead.txt ] && { echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 25 evidence/overhead.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; }
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-${{ matrix.session }}
          path: evidence/
