# Loki in single binary mode, sized for a small Minikube node. The logs go to a small volume and are
# deleted after six hours. The chart runs Loki with a read-only root file system, so a writable
# volume is required. A production setup would use object storage.
#
#   helm upgrade --install loki grafana/loki -n monitoring --version 7.3.0 -f monitoring/loki-values.yaml
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 6h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# The scalable components are not used in single binary mode.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }

# Small extras that are not needed here and cost memory.
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
