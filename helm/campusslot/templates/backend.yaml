{{- if .Values.rollout.enabled }}
# A canary release: the new version first receives a small share of the traffic, an analysis reads its
# own error rate and latency from Prometheus, and the rollout is aborted by itself when they are bad.
# This needs the Argo Rollouts controller (scripts/install-rollouts.sh).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "campusslot.fullname" . }}-backend
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  # When the HPA is enabled it owns the replica count, so Helm must not reset it on every upgrade.
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "campusslot.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  {{- if .Values.rollout.enabled }}
  revisionHistoryLimit: 3
  strategy:
    canary:
      stableService: {{ include "campusslot.fullname" . }}-backend
      canaryService: {{ include "campusslot.fullname" . }}-backend-canary
      {{- if .Values.ingress.enabled }}
      # The ingress controller splits the traffic by weight, so 10 percent means 10 percent of the
      # requests, not "one pod in ten".
      trafficRouting:
        nginx:
          stableIngress: {{ include "campusslot.fullname" . }}
      {{- end }}
      # Never take a stable pod away before its replacement is ready.
      maxUnavailable: 0
      maxSurge: 1
      # The analysis runs in the background from the first step until the rollout is complete. If it
      # fails at any moment, the rollout is aborted and all traffic goes back to the stable version.
      analysis:
        templates:
          - templateName: {{ include "campusslot.fullname" . }}-canary-health
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
  {{- else }}
  # Never take a pod away before its replacement is ready: zero-downtime rollouts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  template:
    {{- include "campusslot.backendPodTemplate" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusslot.fullname" . }}-backend
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
  selector:
    {{- include "campusslot.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
{{- if .Values.rollout.enabled }}
---
# The canary version is reachable through its own Service. Argo Rollouts points it at the new pods only,
# and gives it the same labels as the stable Service, so the ServiceMonitor scrapes both.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusslot.fullname" . }}-backend-canary
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
  selector:
    {{- include "campusslot.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
{{- end }}
