{{- if not .Values.database.existingSecret }}
{{- $password := required "postgres.password is required: pass it at install time with --set-string postgres.password=<value>" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campusslot.fullname" . }}-database
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{ .Values.database.secretKey }}: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.username ($password | urlquery) (include "campusslot.fullname" .) .Values.postgres.database | quote }}
{{- end }}
