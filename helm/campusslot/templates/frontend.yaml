apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusslot.fullname" . }}-frontend
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "campusslot.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "campusslot.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "campusslot.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: {{ include "campusslot.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # The nginx config template proxies /api to this Service (see frontend/nginx.conf.template).
            - name: BACKEND_HOST
              value: {{ include "campusslot.fullname" . }}-backend
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
          # Keep serving for a few seconds after the pod is marked for deletion. The ingress controller
          # learns about the removal a moment later, and until then it still sends requests here.
          {{- with .Values.preStopDelaySeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ . | quote }}]
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "campusslot.containerSecurityContext" . | nindent 12 }}
          # With a read-only root filesystem, nginx needs a writable scratch space and a writable
          # place to render its configuration from the template at start-up.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusslot.fullname" . }}-frontend
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "campusslot.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
