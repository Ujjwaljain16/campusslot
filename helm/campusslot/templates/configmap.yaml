# Non-secret application settings. The database password is not here: it lives in a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "campusslot.fullname" . }}-backend-config
  labels:
    {{- include "campusslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.tracing.enabled }}
  # The standard OpenTelemetry variables. The application starts tracing when the endpoint is set.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.tracing.sampleRatio | quote }}
  {{- end }}
