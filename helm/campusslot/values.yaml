# Default values for the CampusSlot chart. Environment specific overrides live in
# values-dev.yaml (Minikube), values-ci.yaml (kind in GitHub Actions) and values-prod.yaml (EKS).

nameOverride: ""
fullnameOverride: ""

# Needed only when the images live in a private registry, for example:
#   imagePullSecrets: [{ name: ghcr }]
imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/ujjwaljain16/campusslot-backend
    # No default tag on purpose: CI passes the commit SHA, and the chart refuses to render without
    # one so that "latest" can never be deployed by accident.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  # Non-secret settings. They are rendered into a ConfigMap and loaded with envFrom, and a change
  # to any of them rolls the backend pods through a checksum annotation.
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    MAX_BOOKING_HOURS: "12"
    DAY_OPEN_HOUR: "8"
    DAY_CLOSE_HOUR: "20"
  # Sized from measurements, see docs/engineering/cost-and-sizing.md. The request is what one pod
  # uses at about 50 requests per second (p95 264m, 70 MiB). The CPU limit is where one Python
  # process stops getting faster (about one core). The memory limit stays well above the usage,
  # because a process that exceeds it is killed.
  resources:
    requests: { cpu: 250m, memory: 96Mi }
    limits: { cpu: 1000m, memory: 256Mi }

frontend:
  image:
    repository: ghcr.io/ujjwaljain16/campusslot-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  # Static files only: 9 MiB and 14m of CPU at 150 requests per second.
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Seconds a pod keeps serving after it is told to stop, so a rolling update does not send requests
# to a pod that is already going away. Must stay below terminationGracePeriodSeconds (30). 0 disables it.
preStopDelaySeconds: 8

# In-cluster PostgreSQL (StatefulSet + PVC). Fine for a demo; for production prefer a managed
# database such as Amazon RDS: set postgres.enabled=false and provide database.existingSecret.
postgres:
  enabled: true
  image: postgres:16-alpine
  database: campusslot
  username: campusslot
  # Supplied at install time and never stored in Git:
  #   helm upgrade --install ... --set-string postgres.password="$(openssl rand -hex 16)"
  password: ""
  persistence:
    size: 1Gi
    storageClass: ""
  # 30 MiB and 144m of CPU (p95) at 50 requests per second. The memory it uses grows with the page
  # cache of a bigger database, so the limit keeps its headroom.
  resources:
    requests: { cpu: 150m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Scheduled pg_dump of the in-cluster database to its own volume (see docs/engineering/backup-drill.md).
# The time between two backups is the worst case data loss (RPO). This copy lives in the same
# cluster, so it protects against mistakes and a lost database volume, not against losing the cluster.
backup:
  enabled: false
  schedule: "0 2 * * *"
  keep: 7
  size: 1Gi
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Use an existing Secret that already contains a DATABASE_URL key (for example one created by
# External Secrets). When set, the chart does not create its own Secret.
database:
  existingSecret: ""
  secretKey: DATABASE_URL

migration:
  enabled: true
  # Set to true when Argo CD deploys the chart (see gitops/values.yaml).
  argocdHook: false
  ttlSecondsAfterFinished: 600

ingress:
  enabled: true
  className: nginx
  # Empty host matches any hostname, so http://localhost works through a port-forward.
  host: ""
  annotations: {}
  tls: []
  # Also route /docs and /openapi.json to the API so Swagger is reachable through the Ingress.
  exposeApiDocs: true

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  # A share of the CPU request, so it only means something once the request is realistic. With the
  # old request of 100m, 50 percent meant 50m, and 60 requests per second filled 5 pods.
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300

# Canary releases with Argo Rollouts. When enabled, the backend is an Argo Rollout instead of a Deployment:
# a new version gets a small share of the traffic first, and an analysis of its own error rate and latency
# (read from Prometheus) decides whether it goes on or is aborted by itself. Needs the Argo Rollouts
# controller (scripts/install-rollouts.sh), the nginx ingress for the traffic split, and the Prometheus
# Operator for the metrics. Off by default so that the plain Deployment path stays what CI tests.
rollout:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 60s }
  analysis:
    # The release name and the namespace of scripts/install-monitoring.sh.
    prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    interval: 15s
    # Time for Prometheus to discover the new pods and collect enough samples before the first reading.
    initialDelay: 45s
    # Readings that may be bad before the rollout is aborted. 2 means that the third bad reading aborts it.
    failureLimit: 2
    # Equal to the share of failures that the availability SLO already treats as a problem, with some margin.
    maxErrorRatio: 0.02

# Default deny and an allow list of the connections that the application needs (templates/networkpolicy.yaml).
# Only enforced by a network plugin that supports NetworkPolicy (Calico, Cilium). Off by default, because
# the CI cluster (kind) and a default Minikube do not enforce it.
networkPolicy:
  enabled: false
  # The namespaces of the ingress controller and of Prometheus, which may reach the backend.
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

pdb:
  enabled: true
  minAvailable: 1

# Requires the Prometheus Operator CRDs (installed by kube-prometheus-stack).
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

# Alerting rules as code, evaluated by the Prometheus Operator (needs its CRDs). The thresholds follow
# the service level objectives in docs/engineering/slo.md.
prometheusRule:
  enabled: false
  # Share of requests that must not fail with a 5xx status, over 30 days.
  availabilityTarget: 0.995
  # Share of requests that must finish within latencyThresholdSeconds. 0.25 is one of the histogram buckets.
  latencyTarget: 0.95
  latencyThresholdSeconds: "0.25"
  runbookBaseUrl: https://github.com/Ujjwaljain16/campusslot/blob/main/docs/runbooks
