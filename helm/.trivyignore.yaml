# Findings of the chart scan that I accepted on purpose, each with its reason.
misconfigurations:
  - id: KSV-0014
    paths:
      - "templates/postgres.yaml"
    expired_at: 2026-10-20
    statement: "The postgres container writes to its data volume and to its socket directory. A read-only root file system needs two emptyDir mounts, which I will add and verify on a real cluster. The exception expires on 2026-10-20 so that it cannot be forgotten."
  - id: KSV-0020
    statement: "The nginx-unprivileged image runs as uid 101 and the postgres image as uid 70. These are the users that own the files inside those images. A uid above 10000 would mean rebuilding both images."
  - id: KSV-0021
    statement: "Same reason as KSV-0020 for the group id."
  - id: KSV-0125
    statement: "The images come from my own GHCR namespace, are pinned to a commit SHA and are scanned by Trivy before they are pushed. The database is the official postgres image."
  - id: KSV-0110
    statement: "The chart is rendered without a namespace for scanning. At install time the namespace is campusslot, created with the restricted Pod Security profile (k8s/namespace.yaml)."
  - id: KSV-01010
    statement: "False positive. The only key that is flagged is LOG_LEVEL, which holds a log level and no secret. The ConfigMap holds non-secret settings only, and the database password lives in a Secret."
